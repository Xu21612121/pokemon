name: Publish game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static website
        run: |
          node --check app.js
          node --check compat.js
          mkdir -p public
          cp index.html app.js compat.js swipe.js style.css anniversary-data.js anniversary-jp-data.js anniversary.js price-data.js jp-price-data.js slot-rules.js m6-data.js m6.js sv151-data.js sv151.js public/
          cp -r assets public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
